[package]
name = "ddns-provider-namesilo"
version = "0.1.0"
edition = "2021"

[dependencies]
ddns-core = { path = "../ddns-core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
wiremock = "0.6"
