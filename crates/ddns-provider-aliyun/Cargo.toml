[package]
name = "ddns-provider-aliyun"
version = "0.1.0"
edition = "2021"

[dependencies]
ddns-core = { path = "../ddns-core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
chrono = "0.4"
urlencoding = "2.1"

[dev-dependencies]
wiremock = "0.6"
