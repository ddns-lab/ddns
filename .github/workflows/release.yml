name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ddnsd
            asset_name: ddnsd-linux-amd64
          # ARM64 temporarily disabled due to runner availability issues
          # Will be added back in future release
          # - os: ubuntu-24.04-arm64
          #   target: aarch64-unknown-linux-gnu
          #   artifact_name: ddnsd
          #   asset_name: ddnsd-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --bin ddnsd

      - name: Create tarball
        shell: bash
        run: |
          cd target/release
          tar czf ../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *.tar.gz; do
              sha256sum "$file" >> ../../checksums.txt
            done
            cd ..
          done
          cd ..
          cat checksums.txt

      - name: Create source tarball
        run: |
          git archive --format=tar.gz --prefix=ddns-${{ github.ref_name }}/ HEAD > ddns-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ddnsd-linux-amd64/ddnsd-linux-amd64.tar.gz
            checksums.txt
            ddns-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

