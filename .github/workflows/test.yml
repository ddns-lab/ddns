name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Mock/Contract Tests - Run on all platforms
  mock-tests:
    name: Mock Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run mock behavior tests
        run: cargo test -p ddns-ip-netlink --test netlink_behavior_contract --verbose

      - name: Run core contract tests
        run: cargo test -p ddns-core --test event_driven_update_contract --verbose

  # Netlink Integration Tests - Linux only
  # NOTE: These tests are disabled in CI because they require creating veth network interfaces
  # which is not supported in GitHub Actions containers. Run these tests manually on a Linux server:
  # sudo cargo test -p ddns-ip-netlink --test integration_test -- --ignored
  netlink-integration-tests:
    name: Netlink Integration Tests (Skipped in CI)
    runs-on: ubuntu-latest
    if: false  # Disabled in CI - requires veth interface support

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build tests
        run: cargo build --tests -p ddns-ip-netlink --verbose

      - name: Run integration tests with sudo
        run: |
          sudo -E env "PATH=$PATH" cargo test -p ddns-ip-netlink --test integration_test -- --ignored

      - name: Run all netlink tests
        run: |
          sudo -E env "PATH=$PATH" cargo test -p ddns-ip-netlink --verbose

  # Docker Integration Tests
  # NOTE: These tests are disabled in CI because they require:
  # - Privileged mode for network interface manipulation
  # - Host network namespace for netlink socket access
  # - Nested container support (not available in GitHub Actions)
  #
  # Run these tests manually on a Linux server with Docker:
  #   cd crates/ddns-ip-netlink/tests
  #   docker compose -f docker-compose.test.yml build
  #   docker compose -f docker-compose.test.yml run --rm netlink-test
  docker-integration-tests:
    name: Docker Integration Tests (Skipped in CI)
    runs-on: ubuntu-latest
    if: false  # Disabled in CI - requires privileged Docker mode

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: |
          cd crates/ddns-ip-netlink/tests
          docker compose -f docker-compose.test.yml build

      - name: Run integration tests in Docker
        run: |
          cd crates/ddns-ip-netlink/tests
          docker compose -f docker-compose.test.yml run --rm netlink-test

  # Lint checks
  lint:
    name: Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build verification
  build:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build all crates
        run: cargo build --all --verbose

      - name: Build with all features
        run: cargo build --all --all-features --verbose
