[package]
name = "examples"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "embedded_usage"
path = "embedded_usage.rs"

[[bin]]
name = "cloudflare_validation"
path = "cloudflare-validation.rs"
required-features = ["cloudflare"]

[dependencies]
ddns-core = { path = "../crates/ddns-core" }
ddns-provider-cloudflare = { path = "../crates/ddns-provider-cloudflare", optional = true }
ddns-ip-netlink = { path = "../crates/ddns-ip-netlink" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = { workspace = true }
tokio-stream = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

[features]
default = []
cloudflare = ["ddns-provider-cloudflare"]
